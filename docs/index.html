<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Convert RT64 texture dumps into PNG images. Select a folder and download a ZIP. Your files stay in your browser.">
  <title>RT64 Texture converter</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main>
    <header class="intro"><h1>RT64 Texture converter</h1></header>
    <section class="converter" aria-label="Texture converter">
      <h2>Dump folder in. PNGs out.</h2>
      <p class="hint">Select your RT64 dump folder to download a ZIP of editable PNGs.</p>
      <button class="primary" id="select" type="button">Select dump folder</button>
      <input id="folder" type="file" webkitdirectory multiple hidden>
      <div id="result" hidden>
        <div class="status-row"><p id="status" role="status" aria-live="polite"></p><button id="cancel" class="text-button" type="button" hidden>Cancel</button></div>
        <progress id="progress" max="1" value="0" aria-label="Conversion progress"></progress>
        <p id="counts" class="counts"></p>
        <div class="actions"><a id="download" class="primary" hidden>Download ZIP</a></div>
        <p id="download-note" class="hint" hidden>Your download has been requested. If it didn’t start, use the download button.</p>
        <details id="issues" hidden><summary id="issues-title">Files needing attention</summary><ul id="issue-list"></ul></details>
      </div>
      <noscript><p class="error">Enable JavaScript to convert files in your browser.</p></noscript>
    </section>
  </main>
</body>
</html>
